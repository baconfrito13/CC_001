version: 2
updates:
  # Keep the web starter (and merged product apps) current; grouped to one PR per week.
  - package-ecosystem: npm
    directories:
      - /factory/starters/web
      - /products/*/app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node follows the Node.js runtime major (engines, CI: Node 22), not the newest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
