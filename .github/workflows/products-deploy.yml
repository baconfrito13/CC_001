# Deploys product web apps to Vercel. Merging a product PR into main = PREVIEW deploy of the
# apps it changed. Production only on demand ("Run workflow" with production ticked) — the
# factory's go-live path is /lancar, which also checks the founder tasks and approval.
# Inactive until the VERCEL_TOKEN repository secret exists (optional variable VERCEL_SCOPE =
# team slug). One Vercel project per app: <slug> for products/<slug>/app, <slug>-<folder> else.
name: Products · Deploy (Vercel)

on:
  push:
    branches: [main]
    paths: ["products/**"]
  workflow_dispatch:
    inputs:
      dir:
        description: "App folder, e.g. products/my-product/app"
        required: true
        type: string
      production:
        description: "Production deployment (otherwise preview)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.changed.outputs.dirs }}
      enabled: ${{ steps.guard.outputs.enabled }}
    steps:
      - id: guard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN secret not set — deployments are skipped (see SETUP.md)."
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changed
        env:
          EVENT: ${{ github.event_name }}
          INPUT_DIR: ${{ inputs.dir }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if ! printf '%s' "$INPUT_DIR" | grep -Eq '^products/[a-z0-9]+(-[a-z0-9]+)*/[a-z0-9][a-z0-9._-]*$'; then
              echo "::error::dir must look like products/<slug>/<folder>"; exit 1
            fi
            dirs=$(python3 -c 'import json,sys; print(json.dumps([sys.argv[1]]))' "$INPUT_DIR")
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            dirs=$(python3 factory/scripts/factory.py changed --all)
          else
            dirs=$(python3 factory/scripts/factory.py changed --base "$BEFORE" --head "$GITHUB_SHA")
          fi
          dirs=$(printf '%s' "$dirs" | python3 -c 'import json,sys; print(json.dumps([d for d in json.load(sys.stdin) if d.startswith("products/")]))')
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          echo "Apps to deploy: $dirs"

  deploy:
    needs: detect
    if: needs.detect.outputs.enabled == 'true' && needs.detect.outputs.dirs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.detect.outputs.dirs) }}
    concurrency:
      group: deploy-${{ matrix.dir }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Deploy to Vercel
        working-directory: ${{ matrix.dir }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
          DIR: ${{ matrix.dir }}
          PROD: ${{ github.event_name == 'workflow_dispatch' && inputs.production }}
        run: |
          set -euo pipefail
          slug=$(printf '%s' "$DIR" | cut -d/ -f2)
          folder=$(printf '%s' "$DIR" | cut -d/ -f3)
          project="$slug"; if [ "$folder" != "app" ]; then project="$slug-$folder"; fi
          scope=(); if [ -n "${VERCEL_SCOPE:-}" ]; then scope=(--scope "$VERCEL_SCOPE"); fi
          vc() { npx --yes vercel@latest "$@" --token "$VERCEL_TOKEN" "${scope[@]}"; }
          vc project inspect "$project" >/dev/null 2>&1 || vc project create "$project"
          vc link --yes --project "$project"
          args=(deploy --yes); if [ "$PROD" = "true" ]; then args+=(--prod); fi
          url=$(vc "${args[@]}" | tail -n 1)
          echo "### 🚀 \`$project\` → $url" >> "$GITHUB_STEP_SUMMARY"
